name: Meu Vercel — validar e gerar APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar no GitHub Releases (exige assinatura persistente)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Análise, testes e APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.mode }}
      artifact: ${{ steps.version.outputs.artifact }}-${{ steps.signing.outputs.mode }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" do default da action não existe mais.
          packages: platform-tools
      - name: Instalar plataforma e ferramentas Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Configurar Flutter fixado
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Conferir versão, pacote e metadados
        id: version
        run: |
          python3 scripts/check_version.py
          python3 - <<'PY'
          import json, os
          data = json.load(open('version.json'))
          version = data['versionName']
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('A tag deve corresponder à versão do projeto')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nartifact=Meu-Vercel-v{version}\napk=Meu Vercel-v{version}.apk\n')
          PY
      - name: Instalar dependências
        run: flutter pub get
      - name: Analisar código Dart
        run: flutter analyze
      - name: Executar testes automatizados
        run: flutter test --coverage
      - name: Preparar assinatura persistente ou identificar build de teste
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/configure_signing.py
      - name: Compilar APK Release
        env:
          MEU_VERCEL_TEST_SIGNING: ${{ steps.signing.outputs.mode == 'teste' && 'true' || 'false' }}
        run: |
          chmod +x android/gradlew
          flutter build apk --release
      - name: Preparar APK nomeado
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "dist/$APK_NAME"
      - name: Publicar somente APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.version.outputs.apk }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$SIGNING_MODE" = 'estavel' ]; then
            gh release create "v$VERSION" "dist/$APK_NAME" --target "$GITHUB_SHA" --title "Meu Vercel $VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$VERSION" "dist/$APK_NAME" --target "$GITHUB_SHA" --title "Meu Vercel $VERSION (assinatura de teste)" --notes-file RELEASE_NOTES.md --prerelease
          fi
      - name: Remover material de assinatura do runner
        if: always()
        run: rm -f android/key.properties android/release-keystore.jks
